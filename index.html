<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Valentine ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

:root{
 --dark:#060102;
 --maroon:#2a0307;
 --deepred:#4b070c;
 --velvet:#6e0d14;
 --gold:#e2b26f;
}

*{box-sizing:border-box}

body{
 margin:0;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:'Cinzel',serif;
 color:#ffe7ea;
 overflow:hidden;

 /* SOFT ROYAL CARPET BLEND */
 background:
 radial-gradient(circle at top,#6e0d14 0%,#2a0307 60%,#060102 100%),
 repeating-radial-gradient(circle at center,
 rgba(255,255,255,.03) 0px,
 rgba(255,255,255,.03) 2px,
 transparent 4px,
 transparent 12px);
}

.card{
 width:min(720px,92vw);
 padding:48px;
 background:linear-gradient(135deg,rgba(110,13,20,.75),rgba(30,4,7,.9));
 backdrop-filter:blur(22px);
 border-radius:42px;
 box-shadow:
 0 0 80px rgba(226,178,111,.45),
 0 80px 180px rgba(0,0,0,1);
 text-align:center;
 border:1px solid rgba(226,178,111,.25);
}

h1{
 font-size:clamp(32px,4vw,52px);
 letter-spacing:2px;
 text-shadow:0 0 30px rgba(226,178,111,.8);
 margin-bottom:24px;
}

.art{
 width:240px;
 margin:auto;
 filter:drop-shadow(0 0 35px rgba(226,178,111,.9));
 animation:floatsoft 3.5s ease-in-out infinite;
}

@keyframes floatsoft{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-14px)}
}

.buttons{
 position:relative;
 height:180px;
 margin-top:20px;
}

button{
 padding:20px 44px;
 font-size:18px;
 border-radius:80px;
 border:none;
 font-weight:700;
 cursor:pointer;
 position:absolute;
 top:50%;
 transform:translateY(-50%);
 box-shadow:0 20px 60px rgba(0,0,0,1);
 transition:.3s ease;
 font-family:'Cinzel',serif;
}

#yes{
 left:16%;
 background:linear-gradient(135deg,#f4d39c,#c79644);
 color:#2b0608;
}

#yes:hover{
 transform:translateY(-50%) scale(1.15);
 box-shadow:0 0 60px rgba(226,178,111,1);
}

#no{
 left:64%;
 background:#000;
 color:#fff;
}

.result{
 display:none;
 font-family:'Great Vibes',cursive;
 margin-top:32px;
 animation:fadeup 1s ease;
}

.result p{
 font-size:38px;
 color:#ffd9de;
 text-shadow:0 0 45px rgba(226,178,111,1);
}

@keyframes fadeup{
 from{opacity:0;transform:translateY(40px)}
 to{opacity:1;transform:translateY(0)}
}

canvas{
 position:fixed;
 inset:0;
 pointer-events:none;
}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<!-- CLEAN AESTHETIC TIGER -->
<svg class="art" viewBox="0 0 300 280">

<circle cx="70" cy="85" r="40" fill="#c87b3f"/>
<circle cx="230" cy="85" r="40" fill="#c87b3f"/>
<circle cx="70" cy="90" r="22" fill="#f3c087"/>
<circle cx="230" cy="90" r="22" fill="#f3c087"/>

<ellipse cx="150" cy="170" rx="108" ry="96" fill="#e9a35d"/>

<path d="M140 85 Q150 40 160 85" stroke="#5b1c0d" stroke-width="10" fill="none"/>
<path d="M115 125 Q135 100 150 125" stroke="#5b1c0d" stroke-width="8" fill="none"/>
<path d="M185 125 Q165 100 150 125" stroke="#5b1c0d" stroke-width="8" fill="none"/>

<path d="M80 175 Q105 145 125 175" stroke="#5b1c0d" stroke-width="8" fill="none"/>
<path d="M220 175 Q195 145 175 175" stroke="#5b1c0d" stroke-width="8" fill="none"/>

<circle cx="125" cy="175" r="11"/>
<circle cx="175" cy="175" r="11"/>

<path d="M150 200 C140 200 135 215 150 220
         C165 215 160 200 150 200Z" fill="#5b1c0d"/>

<path d="M150 220 Q130 240 115 230" stroke="#5b1c0d" stroke-width="4" fill="none"/>
<path d="M150 220 Q170 240 185 230" stroke="#5b1c0d" stroke-width="4" fill="none"/>

</svg>

<h1>Shanvitha ❤️ Will you be my Valentine?</h1>

<div class="buttons" id="zone">
<button id="yes">Yes</button>
<button id="no">No</button>
</div>

<div class="result" id="result">
<p>
Yayy!!!!! you  are my Valentine now <br>
Your royal ride is on the way <br>
Say code <b>Chowte</b> and start our life journey
</p>
</div>

</div>

<script>

const yes=document.getElementById("yes");
const no=document.getElementById("no");
const zone=document.getElementById("zone");
const result=document.getElementById("result");
const canvas=document.getElementById("confetti");

const confettiInstance=confetti.create(canvas,{resize:true});

let scale=1;

function moveNo(){
 const z=zone.getBoundingClientRect();
 no.style.left=Math.random()*(z.width-no.offsetWidth)+"px";
 no.style.top=Math.random()*(z.height-no.offsetHeight)+"px";

 scale+=0.08;
 yes.style.transform=`translateY(-50%) scale(${scale})`;
}

zone.addEventListener("pointermove",()=>moveNo());

yes.onclick=()=>{
 zone.style.display="none";
 result.style.display="block";

 confettiInstance({
  particleCount:420,
  spread:210,
  origin:{x:.5,y:.5}
 });
};

</script>

</body>
</html>
